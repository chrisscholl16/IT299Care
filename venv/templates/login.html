<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnectLite Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-info sticky-top">
            <a class="navbar-brand" href="#">CareConnectLite</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-item nav-link active" href="/">Home <span class="sr-only">(current)</span></a>
                    <a class="nav-item nav-link active" href="/student">Student</a>
                    <a class="nav-item nav-link active" href="/register">Register</a>
                    <a class="nav-item nav-link active" href="/login">Login</a>
                    <a class="nav-item nav-link active" href="/nurse">Nurse</a>
                </div>
            </div>
        </nav>
    </div>
    <div class="container">
        <header class="bg-transparent text-dark py-5" style="background: url('/static/images/nurse.jpeg') no-repeat center center; color: black; background-size: cover; min-height: 60vh;">
            <div class="container h-100 d-flex align-items-center justify-content-center text-center py-5">
                <div class="row">
                <div class="col-lg-8 mx-auto text-dark p-4 rounded" style="background-color: rgba(255, 255, 255, 0.75);">
                    <h1 class="display-2 fw-bold mb-3" style="color: black;">Login to visit your dashboard</h1>
                </div>
                </div>
            </div>
        </header>
    </div>
    <div class="container">
        <figcaption>
            Image by <a href="https://www.favoritestaffing.com/blog/what-your-favorite-nursing-shoe-says-about-you" target="_blank" rel="noopener">favortiestaffing.com</a> via <a href="https://www.favoritestaffing.com/blog/what-your-favorite-nursing-shoe-says-about-you" target="_blank" rel="noopener">favoritestaffing.com</a> under <a href="https://creativecommons.org" target="_blank" rel="noopener">CC BY 2.0</a>
        </figcaption>
    </div>
    <div class="container text-center">
        <h1>CareConnectLite Login</h1>
        <p>Don't have an account? <a href="{{url_for('register')}}">Sign up here</a></p>
    </div>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-light p-5 rounded shadow-sm">
                <h2 class="mb-4">LOGIN</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100">Sign In</button>
                    </form>
            </div>
        </div>
    </div>
    <br>
    <div class="container">
        <footer class="text-center bg-info">
            <p>&copy; 2026 Chris Scholl Web Design. All rights reserved.<a href="https://www.linkedin.com/in/chris-scholl-webdesigner" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
